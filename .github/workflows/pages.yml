name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Keep Pages from ignoring _next
        run: touch out/.nojekyll
      - name: Publish gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4.6.8
        with:
          folder: out
          branch: gh-pages
          clean: true
          single-commit: true
